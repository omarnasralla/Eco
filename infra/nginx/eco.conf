# Eco — single public entry point.
#
# The frontend (:3000) and the API (:9000) were each exposed directly, which
# meant two ports to open, two origins for the browser to reconcile, and a CORS
# allowlist that had to be edited whenever either address changed. Fronting both
# from one origin removes all three problems: everything below is same-origin,
# so the browser issues no preflight and CORS stops being load-bearing.
#
# Both upstreams now listen on the loopback only. Nothing here is reachable from
# outside except through this server block.

upstream eco_web { server 127.0.0.1:3000; keepalive 16; }
upstream eco_api { server 127.0.0.1:9000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Reports can be sizeable, and a receipt photo is an ordinary upload.
    client_max_body_size 25m;

    # The app is not at the origin root, so send a bare visit on rather than
    # 404ing someone who typed just the host.
    location = / { return 302 /eco/app; }

    # The API keeps its own prefix, so it needs no rewriting — the path the
    # browser asks for is the path Nest routes on.
    location /api/v1/ {
        proxy_pass http://eco_api;
        include /etc/nginx/snippets/eco-proxy.conf;

        # Long enough for a local 3B model to answer on CPU; the assistant
        # streams nothing, so the whole reply lands in one response and the
        # default 60s cuts it off mid-thought.
        proxy_read_timeout 180s;
    }

    location /eco/app {
        proxy_pass http://eco_web;
        include /etc/nginx/snippets/eco-proxy.conf;
    }

    # Next serves its build assets from the app's basePath, so this is covered
    # by the block above. Anything else on this host is not ours to answer for.
    location / { return 404; }
}
