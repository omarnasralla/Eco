# Requests arriving with a Host this deployment does not serve. Without a
# default_server, nginx would fall through to the first block and hand the app
# to anyone probing the bare IP with an arbitrary hostname. 444 closes the
# connection without a response, which is the cheapest possible answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
