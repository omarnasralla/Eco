# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE ONLY — never apply this file, and never commit real values.
#
# In production these keys come from a secret store (AWS Secrets Manager, GCP
# Secret Manager, Vault) synchronised into the cluster by External Secrets
# Operator, so the values never exist in git or in a developer's shell history.
# The Deployment references them by name either way, so nothing else changes.
#
# Generate:
#   openssl rand -base64 48   # JWT secrets (two different ones)
#   openssl rand -base64 32   # ENCRYPTION_KEY, exactly 32 bytes
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: eco-secrets
  namespace: eco
type: Opaque
stringData:
  DATABASE_URL: "postgresql://eco_app:CHANGE_ME@eco-postgres:5432/eco?schema=public&sslmode=require"
  JWT_ACCESS_SECRET: "CHANGE_ME"
  JWT_REFRESH_SECRET: "CHANGE_ME_DIFFERENT"
  ENCRYPTION_KEY: "CHANGE_ME_32_BYTE_BASE64"
  AI_SERVICE_TOKEN: "CHANGE_ME"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
  MAIL_FROM: "Eco <no-reply@eco.app>"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
