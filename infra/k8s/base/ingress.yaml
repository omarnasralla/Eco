apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eco
  namespace: eco
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Reports and CSV imports are the largest payloads; 10MB is generous for
    # both and small enough to blunt a trivial body-size DoS.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # A local LLM answer can take 30s+ on CPU.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.eco.example.com, api.eco.example.com]
      secretName: eco-tls
  rules:
    - host: app.eco.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: eco-web, port: { number: 3000 } }
    - host: api.eco.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: eco-api, port: { number: 4000 } }
